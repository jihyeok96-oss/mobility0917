spring:
  application:
    name: mobility
  datasource:
    url: jdbc:postgresql://localhost:5432/mobility
    username: postgres
    password: 1004
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    sql-show: true
    properties:
      hibernate:
        format_sql: true
  thymeleaf:
    cache: false

server:
  port: 8081